name: Velocity Platform Proof

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate desktop project
        shell: bash
        run: node test/generate-platform.mjs desktop .proof/desktop
      - name: Build and launch desktop target
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            gcc .proof/desktop/main.c -O2 -o .proof/desktop/velocity.exe
            output=$(.proof/desktop/velocity.exe)
          else
            cc .proof/desktop/main.c -O2 -o .proof/desktop/velocity
            output=$(.proof/desktop/velocity)
          fi
          test "$output" = "Velocity Desktop Ready"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mrcodeislife718/Plasma
          path: Plasma
      - uses: actions/checkout@v4
        with:
          repository: mrcodeislife718/Chronos
          path: Chronos
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate Android project and signed ecosystem handoff
        run: |
          node test/generate-platform.mjs android .proof/android
          node test/ecosystem-handoff.mjs .proof/ecosystem-handoff.json
      - uses: android-actions/setup-android@v3
      - name: Build installable Android APK
        working-directory: .proof/android
        run: gradle :app:assembleDebug --stacktrace
      - name: Boot emulator, pair, hot reload, and verify without reinstall
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            set -euo pipefail
            adb install -r .proof/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n dev.cannon.velocityproof/.MainActivity
            adb shell uiautomator dump /sdcard/before.xml >/dev/null
            adb shell cat /sdcard/before.xml | grep 'Velocity Android Ready'
            payload=$(node -p "require('./.proof/ecosystem-handoff.json').message")
            token=$(node -p "require('./.proof/ecosystem-handoff.json').pairingToken")
            verified=$(node -p "require('./.proof/ecosystem-handoff.json').verified")
            test "$verified" = "true"
            adb shell am start -W -n dev.cannon.velocityproof/.MainActivity --es payload "$payload" --es pairingToken "$token"
            sleep 1
            adb shell uiautomator dump /sdcard/after.xml >/dev/null
            adb shell cat /sdcard/after.xml | grep "$payload"
            adb shell cat /sdcard/after.xml | grep "velocity-proof:$token"

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate iOS project
        run: node test/generate-platform.mjs ios .proof/ios
      - name: Build simulator app bundle
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          mkdir -p .proof/ios/VelocityProof.app
          xcrun swiftc .proof/ios/main.swift -sdk "$sdk" -target arm64-apple-ios17.0-simulator -emit-executable -o .proof/ios/VelocityProof.app/VelocityProof
          cp .proof/ios/Info.plist .proof/ios/VelocityProof.app/Info.plist
          plutil -lint .proof/ios/VelocityProof.app/Info.plist
      - name: Boot simulator, install, launch, and verify process
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for values in d.values() for x in values if "iPhone" in x["name"] and x["isAvailable"]))')
          xcrun simctl boot "$device" || true
          open -a Simulator || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" .proof/ios/VelocityProof.app
          pid=$(xcrun simctl launch "$device" dev.cannon.velocityproof | awk '{print $2}')
          test -n "$pid"
